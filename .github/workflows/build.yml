name: Build Minimal AdBlock+NoUpdate
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hook dylib
        run: |
          cat > hook_ad.m << 'OBJCEOF'
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <UIKit/UIKit.h>

          // Empty implementations for splash ad load methods
          static void splash_noop(id self, SEL _cmd) {
              NSLog(@"[Hook] Blocked: %@ - %@", NSStringFromClass([self class]), NSStringFromSelector(_cmd));
          }
          static void splash_noop_window(id self, SEL _cmd, id window) {
              NSLog(@"[Hook] Blocked: %@ - %@", NSStringFromClass([self class]), NSStringFromSelector(_cmd));
          }
          static void splash_noop_vc(id self, SEL _cmd, id vc) {
              NSLog(@"[Hook] Blocked: %@ - %@", NSStringFromClass([self class]), NSStringFromSelector(_cmd));
          }
          static BOOL return_no(id self, SEL _cmd) {
              NSLog(@"[Hook] Return NO: %@ - %@", NSStringFromClass([self class]), NSStringFromSelector(_cmd));
              return NO;
          }
          static BOOL return_yes(id self, SEL _cmd) {
              NSLog(@"[Hook] Return YES: %@ - %@", NSStringFromClass([self class]), NSStringFromSelector(_cmd));
              return YES;
          }
          static void return_nil(id self, SEL _cmd) {
              NSLog(@"[Hook] Return nil: %@ - %@", NSStringFromClass([self class]), NSStringFromSelector(_cmd));
          }

          // Hook specific methods on a class
          static void hook_method(Class cls, SEL sel, IMP newImp) {
              if (!cls) return;
              Method method = class_getInstanceMethod(cls, sel);
              if (method) {
                  method_setImplementation(method, newImp);
                  NSLog(@"[Hook] Hooked %@ - %@", NSStringFromClass(cls), NSStringFromSelector(sel));
              }
          }

          // Hook class method
          static void hook_class_method(Class cls, SEL sel, IMP newImp) {
              if (!cls) return;
              Method method = class_getClassMethod(cls, sel);
              if (method) {
                  method_setImplementation(method, newImp);
                  NSLog(@"[Hook] Hooked class %@ +%@", NSStringFromClass(cls), NSStringFromSelector(sel));
              }
          }

          __attribute__((constructor))
          static void hook_init(void) {
              NSLog(@"[Hook] Initializing...");
              
              // ===== AD BLOCK =====
              // Hook specific splash ad classes
              hook_method(objc_getClass("GDTSplashAd"), @selector(loadAdAndShowInWindow:), (IMP)splash_noop_window);
              hook_method(objc_getClass("GDTSplashAd"), @selector(loadAd), (IMP)splash_noop);
              hook_method(objc_getClass("GDTSplashAd"), @selector(loadAdAndShowInRootViewController:), (IMP)splash_noop_vc);
              
              hook_method(objc_getClass("AMPSSplashAd"), @selector(loadAd), (IMP)splash_noop);
              hook_method(objc_getClass("AMPSSplashAd"), @selector(loadAdAndShow), (IMP)splash_noop);
              
              hook_method(objc_getClass("CSJSplashAd"), @selector(loadAd), (IMP)splash_noop);
              hook_method(objc_getClass("CSJSplashAd"), @selector(loadAdAndShowInWindow:), (IMP)splash_noop_window);
              
              hook_method(objc_getClass("BUSplashAd"), @selector(loadAd), (IMP)splash_noop);
              hook_method(objc_getClass("BUSplashAd"), @selector(loadAdAndShowInWindow:), (IMP)splash_noop_window);
              
              hook_method(objc_getClass("KSSplashAdView"), @selector(loadAd), (IMP)splash_noop);
              hook_method(objc_getClass("BaiduMobAdSplash"), @selector(loadAd), (IMP)splash_noop);
              hook_method(objc_getClass("MTGSplashAD"), @selector(loadAd), (IMP)splash_noop);
              hook_method(objc_getClass("AdGainSplashAd"), @selector(loadAd), (IMP)splash_noop);
              hook_method(objc_getClass("BeiZiSplashAd"), @selector(loadAd), (IMP)splash_noop);
              
              // ===== UPDATE BLOCK =====
              // Hook specific update check methods
              // Find all classes that respond to checkNewestVersion:
              unsigned int classCount = 0;
              Class *allClasses = objc_copyClassList(&classCount);
              for (unsigned int i = 0; i < classCount; i++) {
                  Class cls = allClasses[i];
                  NSString *clsName = NSStringFromClass(cls);
                  
                  // Skip known ad/map SDK classes
                  if ([clsName hasPrefix:@"GMS"] || [clsName hasPrefix:@"AMap"] || 
                      [clsName hasPrefix:@"Baidu"] || [clsName hasPrefix:@"ABU"] ||
                      [clsName hasPrefix:@"CSJ"] || [clsName hasPrefix:@"KS"] ||
                      [clsName hasPrefix:@"GDT"] || [clsName hasPrefix:@"MTG"] ||
                      [clsName hasPrefix:@"BeiZi"] || [clsName hasPrefix:@"AdGain"] ||
                      [clsName hasPrefix:@"AMPS"] || [clsName hasPrefix:@"Google"] ||
                      [clsName hasPrefix:@"FIR"] || [clsName hasPrefix:@"NS"] ||
                      [clsName hasPrefix:@"UI"] || [clsName hasPrefix:@"_"] ||
                      [clsName hasPrefix:@"NSKV"] || [clsName hasPrefix:@"__"]) {
                      continue;
                  }
                  
                  // Check for specific update-related methods
                  Method checkNewestVersion = class_getInstanceMethod(cls, @selector(checkNewestVersion:));
                  Method checkVersion = class_getInstanceMethod(cls, @selector(checkVersion));
                  
                  if (checkNewestVersion) {
                      method_setImplementation(checkNewestVersion, (IMP)splash_noop);
                      NSLog(@"[Hook] Update blocked: %@ - checkNewestVersion:", clsName);
                  }
                  if (checkVersion) {
                      method_setImplementation(checkVersion, (IMP)splash_noop);
                      NSLog(@"[Hook] Update blocked: %@ - checkVersion", clsName);
                  }
              }
              free(allClasses);
              
              NSLog(@"[Hook] Done - ads and update prompts blocked");
          }
          OBJCEOF
          
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -fobjc-arc \
            -O2 \
            -mios-version-min=15.0 \
            -install_name @rpath/libHook.dylib \
            -o libHook.dylib \
            hook_ad.m
          
          file libHook.dylib
          ls -la libHook.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: hook-dylib
          path: libHook.dylib
