name: Build Empty Test Dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build empty test dylib
        run: |
          cat > empty.m << 'EOF'
          #import <objc/runtime.h>
          __attribute__((constructor))
          static void init(void) {}
          EOF
          
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -O2 \
            -mios-version-min=15.0 \
            -install_name @rpath/libEmpty.dylib \
            -o libEmpty.dylib \
            empty.m
          
          ls -la libEmpty.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: empty-dylib
          path: libEmpty.dylib
